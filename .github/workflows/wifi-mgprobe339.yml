name: Read-only fixed capability probe for iOS16
on:
  push:
    branches: [wifi16-mgprobe-20261115]
    paths: [.github/workflows/wifi-mgprobe339.yml, netdiag323/src/unixnu-mgprobe.c, netdiag323/ci/build_mgprobe.py]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Build own read-only fixed-key probe with genuine iPhoneOS SDK
        run: python3 -B netdiag323/ci/build_mgprobe.py "${{ runner.temp }}/mgprobe339"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wifi-mgprobe339
          path: ${{ runner.temp }}/mgprobe339/
          retention-days: 7
          if-no-files-found: error
