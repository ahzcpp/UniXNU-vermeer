name: Public synthetic detached signature fixtures
on:
  push:
    branches: [wifi16-detached-fixtures-20261115]
    paths: [.github/workflows/wifi-detached-fixtures307.yml, 'wifi-detached-fixtures307/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-fixtures:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Native XPC and detached signature fixtures
        run: python3 -B wifi-detached-fixtures307/native_fixture.py "${{ runner.temp }}/detached-fixtures307"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-detached-fixtures307
          path: ${{ runner.temp }}/detached-fixtures307/
          if-no-files-found: error
          retention-days: 3
