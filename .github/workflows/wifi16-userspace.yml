name: WiFi supplicant for iOS 16.7
on:
  push:
    branches: [gpu16-build-20261111]
    paths: [.github/workflows/wifi16-userspace.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  supplicant:
    runs-on: macos-15-intel
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fetch pinned native WiFi adapter
        shell: bash
        run: |
          set -euo pipefail
          git init wifi
          git -C wifi remote add origin https://github.com/UniXNU/Ath12kWifi.git
          git -C wifi fetch --depth=1 origin 5f7f5a8a9f02f7ab45ed10a2f226e348c519a838
          git -C wifi checkout --detach FETCH_HEAD
      - name: Verify original supplicant and select ordinary arm64 iOS 16.7
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import importlib.util,json,hashlib
          from pathlib import Path
          root=Path('wifi').resolve()
          spec=importlib.util.spec_from_file_location('fetch',root/'tools/fetch-sources.py')
          fetch=importlib.util.module_from_spec(spec);spec.loader.exec_module(fetch)
          (root/'deps').mkdir()
          lock=json.loads((root/'tools/source-lock.json').read_text())
          identity=fetch.resolve_archive(lock['supplicant'],False)
          p=root/'tools/prepare-supplicant.py';old=p.read_text()
          anchor='subprocess.run(["python3", str(root / "tools/fetch-sources.py"), "--check"], check=True)'
          assert old.count(anchor)==1
          # This job links only the supplicant, not Linux/mac80211/FreeBSD objects.
          # Verify precisely its locked release archive; retain the backend edits unchanged.
          replacement='''import importlib.util
          spec=importlib.util.spec_from_file_location("fetch",root/"tools/fetch-sources.py")
          fetch=importlib.util.module_from_spec(spec);spec.loader.exec_module(fetch)
          fetch.resolve_archive(json.loads((root/"tools/source-lock.json").read_text())["supplicant"],True)'''
          p.write_text(old.replace(anchor,replacement))
          p=root/'tools/build-supplicant.py';old_build=p.read_text()
          assert old_build.count('arm64e-apple-ios27.0')==1
          p.write_text(old_build.replace('arm64e-apple-ios27.0','arm64-apple-ios16.7'))
          (root/'out').mkdir()
          (root/'out/ios16-source-selection.json').write_text(json.dumps(dict(
              adapter_revision='5f7f5a8a9f02f7ab45ed10a2f226e348c519a838',supplicant=identity,
              kernel_sources_not_required_by_userspace=True,authentication_algorithms_modified=False,
              deployment='arm64-apple-ios16.7',build_script_original_sha256=hashlib.sha256(old_build.encode()).hexdigest()),indent=2)+'\n')
          PY
      - name: Compile native WPA2 supplicant
        shell: bash
        run: |
          set -euo pipefail
          python3 wifi/tools/build-supplicant.py --target ios --jobs 4
      - name: Sign and audit owner-built executable
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,plistlib,struct,subprocess,re
          out=Path('wifi/out/wpa-ios');exe=out/'bin/wpa_supplicant'
          ent=out/'entitlements.plist'
          ent.write_bytes(plistlib.dumps({'com.apple.private.security.no-container':True}))
          subprocess.run(['codesign','--force','--sign','-','--pagesize','4096','--identifier','org.unixnu.wpa_supplicant','--entitlements',ent,exe],check=True)
          subprocess.run(['codesign','--verify','--strict',exe],check=True)
          detail=subprocess.run(['codesign','--display','--verbose=4',exe],check=True,capture_output=True,text=True).stderr
          assert re.search(r'^Page size=4096$',detail,re.M)
          cdhash=re.search(r'^CDHash=([a-f0-9]{40})$',detail,re.M)[1]
          data=exe.read_bytes();assert struct.unpack_from('<3I',data)==(0xfeedfacf,0x100000c,0)
          at=32;versions=[]
          for _ in range(struct.unpack_from('<I',data,16)[0]):
              cmd,size=struct.unpack_from('<II',data,at)
              if cmd==0x32:
                  platform,minimum=struct.unpack_from('<II',data,at+8)
                  assert platform==2 and minimum<=0x100700
                  versions.append(hex(minimum))
              at+=size
          assert versions
          (out/'imports.txt').write_text(subprocess.check_output(['nm','-u',exe],text=True))
          (out/'ios16-audit.json').write_text(json.dumps(dict(cdhash=cdhash,sha256=hashlib.sha256(data).hexdigest(),bytes=len(data),minimum_ios=versions,hardware_tested=False,firmware_included=False),indent=2)+'\n')
          PY
      - name: Upload only source-built supplicant and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k70-wifi-supplicant-ios16
          retention-days: 3
          if-no-files-found: warn
          path: |
            wifi/out/wpa-ios/bin/wpa_supplicant
            wifi/out/wpa-ios/*.json
            wifi/out/wpa-ios/imports.txt
            wifi/out/wpa-ios/build.log
            wifi/out/ios16-source-selection.json
