name: System app migration runner475
on:
  push:
    branches: [sysapps475-20261123]
    paths: ['sysapps475/**', '.github/workflows/sysapps475.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sysapps475:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Genuine SDK build and owned signature
        run: bash sysapps475/ci/build475.sh "${{ runner.temp }}/sysapps475"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sysapps475
          path: ${{ runner.temp }}/sysapps475/delivery/
          if-no-files-found: error
          retention-days: 7
