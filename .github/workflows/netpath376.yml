name: Read-only network path comparison376
on:
  push:
    branches: [wifi16-netpath376-20261115]
    paths: ['netpath376/**', '.github/workflows/netpath376.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  netpath376:
    runs-on: macos-15
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Genuine SDK, sanitizer fixtures, runner smoke and own 4K signature
        run: bash netpath376/ci/build.sh "${{ runner.temp }}/netpath376"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: diag-netpath376
          path: ${{ runner.temp }}/netpath376/delivery/
          if-no-files-found: error
          retention-days: 7
