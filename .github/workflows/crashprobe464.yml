name: Read-only crashprobe464 source qualification
on:
  push:
    branches: [crashprobe464-20261122]
    paths: ['src/**', 'tests/**', 'ci/**', 'config/**', '.github/workflows/crashprobe464.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    runs-on: macos-15
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Synthetic Foundation tests and signed genuine iOS SDK binary
        run: bash ci/build464.sh "${{ runner.temp }}/crashprobe464"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: owned-crashprobe464
          path: ${{ runner.temp }}/crashprobe464/delivery/
          if-no-files-found: error
          retention-days: 7
