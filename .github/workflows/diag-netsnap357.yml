# Source-only SDK build of the own read-only process/socket snapshot probe. Does not install or enable anything.
name: Diag netsnap357 for iOS 16.7
on:
  push:
    branches: [wifi16-memwatch357-20261115]
    paths: [.github/workflows/diag-netsnap357.yml, 'netsnap357/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  netsnap357:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Policy check, runner smoke run, iOS build and own ad-hoc 4K signature
        run: bash netsnap357/ci/build.sh "${{ runner.temp }}/netsnap357"
      - name: Retain own binary and audit metadata only
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: diag-netsnap357
          path: ${{ runner.temp }}/netsnap357/delivery/
          if-no-files-found: error
          retention-days: 7
