name: GPU userspace for iOS 16.7

on:
  push:
    branches: [gpu16-scanout-telemetry-20261113]
    paths: [.github/workflows/gpu16-userspace.yml, gpu16/patch-client-diagnostics.py, gpu16/patch-gpu-scanout-verify.py, gpu16/GpuScanoutVerify.h, gpu16/GpuScanoutPace.h, gpu16/patch-scanout-diag-channel.py]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  userspace:
    runs-on: macos-15-intel
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Fetch the exact source used by the K70 kernel ABI
        shell: bash
        run: |
          set -euo pipefail
          git init unixnu
          git -C unixnu remote add origin https://github.com/UniXNU/UniXNU.git
          git -C unixnu fetch --depth=1 origin c1ecc5b74c9dc4ced13bcfbd81a2c3998025a5e5
          git -C unixnu checkout --detach FETCH_HEAD
          git -C unixnu submodule update --init --depth=1 drivers/Adreno740 drivers/AdrenoMetal drivers/GopFramebuffer kits/AdrenoPM4

      - name: Install compiler tools
        shell: bash
        run: |
          set -euo pipefail
          brew install llvm ninja glslang bison shaderc
          if ! command -v rustup >/dev/null; then brew install rustup; fi
          export PATH="$HOME/.cargo/bin:$(brew --prefix llvm)/bin:$PATH"
          rustup toolchain install 1.98.0 --profile minimal --target aarch64-apple-ios
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Select iOS 16.7 deployment without changing runtime code
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,re
          root=Path('unixnu')
          changes=[]
          p=root/'drivers/AdrenoMetal/NativeBridgeMetalFrontend.mm'
          old=p.read_text()
          anchor='const NSUInteger version=options && options.languageVersion?(NSUInteger)options.languageVersion:(NSUInteger)MTLLanguageVersion3_1;'
          assert old.count(anchor)==1
          replacement='''NSUInteger defaultLanguage=(NSUInteger)MTLLanguageVersion3_0;
           if(@available(iOS 17.0,macOS 14.0,*))defaultLanguage=(NSUInteger)MTLLanguageVersion3_1;
           const NSUInteger version=options && options.languageVersion?(NSUInteger)options.languageVersion:defaultLanguage;'''
          p.write_text(old.replace(anchor,replacement))
          changes.append(dict(file=str(p.relative_to(root)),before=hashlib.sha256(old.encode()).hexdigest(),after=hashlib.sha256(p.read_bytes()).hexdigest(),reason='Use MSL3.0 default on iOS16 and guard the iOS17 constant; explicit caller options preserved'))
          p=root/'drivers/AdrenoMetal/NativeAdrenoMetalPlugin.mm'
          old=p.read_text();new=old
          for signature in ['static bool writeTask(', 'static unsigned patchFramebufferBranch(']:
              assert new.count(signature)==1
              new=new.replace(signature,'[[maybe_unused]] '+signature)
          p.write_text(new)
          changes.append(dict(file=str(p.relative_to(root)),before=hashlib.sha256(old.encode()).hexdigest(),after=hashlib.sha256(new.encode()).hexdigest(),reason='Annotate optional hooks unused by the ordinary-arm64 build; retain all compiler errors and runtime code'))
          for name in ['build-turnip-darwin.py','build-adreno-metal-plugin.py','build-adreno-metal-bridge.py']:
              p=root/'scripts'/name
              old=p.read_text()
              assert '17.0' in old,name
              new=old.replace('17.0','16.7')
              p.write_text(new)
              changes.append(dict(file=name,before=hashlib.sha256(old.encode()).hexdigest(),after=hashlib.sha256(new.encode()).hexdigest()))
          # Explicit new-file metadata is required by the runner's Git 2.55.
          # Keep paths, hunk contents and runtime source bytes unchanged.
          for folder in [root/'patches/mesa',root/'drivers/AdrenoMetal/bridge/patches']:
              for p in sorted(folder.glob('*.patch')):
                  old=p.read_text()
                  new=re.sub(r'(^diff --git a/(\S+) b/\2\n)(?=--- /dev/null\n)',r'\1new file mode 100644\n',old,flags=re.M)
                  if new!=old:
                      assert new.replace('new file mode 100644\n','')==old.replace('new file mode 100644\n','')
                      p.write_text(new)
                      changes.append(dict(file=str(p.relative_to(root)),before=hashlib.sha256(old.encode()).hexdigest(),after=hashlib.sha256(new.encode()).hexdigest(),metadata_only=True))
          (root/'build').mkdir(exist_ok=True)
          (root/'build/ios16-deployment-changes.json').write_text(json.dumps(changes,indent=2)+'\n')
          PY

      - name: Apply and check bounded phone scanout scaling
        shell: bash
        run: |
          set -euo pipefail
          python3 gpu16/patch-gpu-scanout-scale.py unixnu
          python3 gpu16/check-gpu-scanout-ir.py unixnu
      - name: Add default-off scaled verification and scanout cadence
        shell: bash
        run: python3 gpu16/patch-gpu-scanout-verify.py unixnu
      - name: Keep optional scanout observations separate from progress
        shell: bash
        run: python3 gpu16/patch-scanout-diag-channel.py unixnu
      - name: Record the first Vulkan startup failure on the device
        shell: bash
        run: |
          set -euo pipefail
          cp gpu16/turnip-startup-log.patch unixnu/patches/mesa/turnip-startup-log.patch
          python3 - <<'PY'
          from pathlib import Path
          import json
          p=Path('unixnu/scripts/data/adreno-compiler-inputs.json')
          pins=json.loads(p.read_text())
          pins['patches'].append('patches/mesa/turnip-startup-log.patch')
          p.write_text(json.dumps(pins,indent=2)+'\n')
          PY
      - name: Match the measured iOS16 Metal base ABI
        shell: bash
        run: python3 gpu16/patch-ios16-metal-device.py unixnu
      - name: Add opt-in bounded render-client diagnostics
        shell: bash
        run: python3 gpu16/patch-client-diagnostics.py unixnu
      - name: Restore exact Rust bridge build cache
        id: bridge-cache
        uses: actions/cache/restore@v4
        with:
          key: k70-gpu16-intel-rust198-c1ecc5b7-m2v624bab3-scale-b8750f55-v1
          path: |
            unixnu/build/m2v-target
            unixnu/.cache/gpu-reference/metal2vulkan
            ~/.cargo/registry
      - name: Build Turnip and Metal frontend with genuine SDK and signatures
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import importlib.util,sys,subprocess
          root=Path('unixnu').resolve()
          sys.path.insert(0,str(root/'scripts'))
          spec=importlib.util.spec_from_file_location('runtime_builder',root/'scripts/build-boot-runtime.py')
          module=importlib.util.module_from_spec(spec);spec.loader.exec_module(module)
          try:
              plugin=module.build_plugin('ios')
          except BaseException:
              # Surface the actual generator/compiler failure, including hidden cache logs.
              for log in sorted((root/'.cache').glob('mesa-tu-ios-*.log')):
                  print('\n==== '+str(log)+' ====\n'+log.read_text(errors='replace')[-18000:],flush=True)
              raise
          subprocess.run([sys.executable,root/'scripts/make-gpu-addon.py','--publish','--no-daemon',root/'build/gpuaddon-ios16.bin'],check=True)
          PY

      - name: Save only exact-source Rust build outputs
        if: always() && steps.bridge-cache.outputs.cache-hit != 'true' && hashFiles('unixnu/build/adreno-metal-bridge/ios/libadreno_metal_bridge.a') != ''
        uses: actions/cache/save@v4
        with:
          key: k70-gpu16-intel-rust198-c1ecc5b7-m2v624bab3-scale-b8750f55-v1
          path: |
            unixnu/build/m2v-target
            unixnu/.cache/gpu-reference/metal2vulkan
            ~/.cargo/registry
      - name: Audit architectures, deployment versions, signatures and imports
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,plistlib,struct,subprocess
          root=Path('unixnu');bundle=root/'build/adreno-metal-plugin/NativeAdrenoMetal.bundle'
          report=[]
          assert plistlib.loads((bundle/'Info.plist').read_bytes())['MinimumOSVersion']=='16.7'
          for p in [bundle/'NativeAdrenoMetal',bundle/'libvulkan_freedreno.dylib']:
              data=p.read_bytes()
              assert struct.unpack_from('<3I',data)==(0xfeedfacf,0x100000c,0),p
              commands=struct.unpack_from('<I',data,16)[0];at=32;minimums=[]
              for _ in range(commands):
                  cmd,size=struct.unpack_from('<II',data,at)
                  if cmd==0x32:
                      platform,minimum=struct.unpack_from('<II',data,at+8)
                      assert platform==2 and minimum<=0x00100700,(p,platform,hex(minimum))
                      minimums.append(hex(minimum))
                  if cmd==0x25:
                      minimum=struct.unpack_from('<I',data,at+8)[0]
                      assert minimum<=0x00100700,(p,hex(minimum))
                      minimums.append(hex(minimum))
                  at+=size
              assert minimums,p
              subprocess.run(['codesign','--verify','--strict',p],check=True)
              imports=subprocess.check_output(['nm','-u',str(p)],text=True)
              (root/'build'/(p.name+'-imports.txt')).write_text(imports)
              report.append(dict(file=p.name,sha256=hashlib.sha256(data).hexdigest(),bytes=len(data),minimums=minimums))
          (root/'build/ios16-artifact-audit.json').write_text(json.dumps(dict(binaries=report,hardware_tested=False,apple_or_oem_binaries_included=False),indent=2)+'\n')
          PY

      - name: Upload only owner-built userspace output and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k70-gpu-userspace-ios16
          retention-days: 3
          include-hidden-files: true
          if-no-files-found: warn
          path: |
            unixnu/build/gpuaddon-ios16.bin
            unixnu/build/adreno-metal-plugin/trust.json
            unixnu/build/ios16-*.json
            unixnu/build/*-imports.txt
            unixnu/.cache/mesa-tu-ios-*.log
            unixnu/build/adreno-metal-bridge/build-ios.log
