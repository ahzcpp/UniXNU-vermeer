# Source-only SDK build of the own read-only process/socket snapshot probe. Does not install or enable anything.
name: Diag netprefs369 for iOS 16.7
on:
  push:
    branches: [wifi16-netprefs369-20261115]
    paths: [.github/workflows/diag-netprefs369.yml, 'netprefs369/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  netprefs369:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Policy check, runner smoke run, iOS build and own ad-hoc 4K signature
        run: bash netprefs369/ci/build.sh "${{ runner.temp }}/netprefs369"
      - name: Retain own binary and audit metadata only
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: diag-netprefs369
          path: ${{ runner.temp }}/netprefs369/delivery/
          if-no-files-found: error
          retention-days: 7
